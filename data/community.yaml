help:
  - name: GitHub Discussions
    url: https://github.com/bbatsov/projectile/discussions
    blurb: Questions, ideas and general discussions.
  - name: Issue tracker
    url: https://github.com/bbatsov/projectile/issues
    blurb: Bugs and feature requests.
  - name: Troubleshooting
    url: https://docs.projectile.mx/projectile/troubleshooting.html
    blurb: When something isn't working the way you expect.
  - name: Cheatsheet
    url: https://docs.projectile.mx/projectile/cheatsheet.html
    blurb: Every command and keybinding on one page.

supportBlurb: >-
  Projectile is free, but maintaining it takes a lot of time and effort. If
  you find it useful, please consider supporting its development:

# The funding platforms; the recommended one comes first.
support:
  - name: GitHub Sponsors
    url: https://github.com/sponsors/bbatsov
    recommended: true
    blurb: monthly or one-time, right from your GitHub account
  - name: Liberapay
    url: https://liberapay.com/bbatsov
    blurb: recurring donations, run as a non-profit
  - name: Patreon
    url: https://www.patreon.com/bbatsov
    blurb: monthly memberships
  - name: PayPal
    url: https://www.paypal.me/bbatsov
    blurb: a one-off donation
